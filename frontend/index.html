<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMEflow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="landing-shell">
        <div class="landing-panel">
            <p class="page-label">SMALL BUSINESS MARKETPLACE</p>
            <h1>Choose your portal</h1>
            <p>Run your business or shop as a customer.</p>

            <div class="landing-grid">
                <div class="landing-card">
                    <h3>Owner</h3>
                    <p>Manage businesses, inventory, products, and order tracking.</p>
                    <a href="owner.html" class="primary-button" style="text-align:center; text-decoration:none; display:inline-block; width:fit-content;">Open Owner Portal</a>
                </div>

                <div class="landing-card">
                    <h3>Customer</h3>
                    <p>Browse products, add items to cart, and pay securely.</p>
                    <a href="customer.html" class="primary-button" style="text-align:center; text-decoration:none; display:inline-block; width:fit-content;">Open Customer Portal</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
